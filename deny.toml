[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
ignore = [
    # async-std is discontinued; only used by the optional `runtime-async-std` runtime
    "RUSTSEC-2025-0052",
    # pin-utils is unmaintained; only pulled in by async-std
    "RUSTSEC-2026-0441",
]
