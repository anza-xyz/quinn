[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
]
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
ignore = [
    "RUSTSEC-2025-0052",
    # Agave v4.3 ignores this advisory in ci/do-audit.sh.
    "RUSTSEC-2026-0285",
    # h2: only used by perf tooling in this workspace.
    "RUSTSEC-2026-0258",
    # anyhow: only used by tooling and dev dependencies.
    "RUSTSEC-2026-0190",
]
